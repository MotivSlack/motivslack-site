<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="650" height="250">
<defs>
<!-- Gradient definitions for depth -->
<linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#00acc1;stop-opacity:1" />
<stop offset="100%" style="stop-color:#00897b;stop-opacity:1" />
</linearGradient>
<linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#8e24aa;stop-opacity:1" />
<stop offset="100%" style="stop-color:#6a1b9a;stop-opacity:1" />
</linearGradient>
<linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#ef5350;stop-opacity:1" />
<stop offset="100%" style="stop-color:#c62828;stop-opacity:1" />
</linearGradient>

<!-- Drop shadow filter -->
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
<feOffset dx="2" dy="2" result="offsetblur"/>
<feComponentTransfer>
<feFuncA type="linear" slope="0.3"/>
</feComponentTransfer>
<feMerge>
<feMergeNode/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>

<!-- Background subtle shape -->
<ellipse cx="325" cy="125" rx="320" ry="80" fill="#f5f5f5" opacity="0.3"/>

<!-- Main Logo Text with custom styling -->
<g filter="url(#shadow)">
<!-- "Motiv" in Teal -->
<text x="80" y="140" fill="url(#tealGrad)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="85px">Motiv</text>

<!-- "Slack" in Purple -->
<text x="315" y="140" fill="url(#purpleGrad)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="85px">Slack</text>
</g>

<!-- Creative Spark/Star replacing the dot on 'i' -->
<g transform="translate(225, 85)">
<path d="M0,-15 L4,-5 L14,-3 L7,4 L9,14 L0,8 L-9,14 L-7,4 L-14,-3 L-4,-5 Z" fill="url(#redGrad)" filter="url(#shadow)"/>
<!-- Inner glow effect -->
<circle cx="0" cy="0" r="3" fill="#fff" opacity="0.8"/>
</g>

<!-- Enhanced Paper Plane with motion trail -->
<g transform="translate(530, 65)">
<!-- Motion trails -->
<path d="M-60,10 Q-30,5 0,0" fill="none" stroke="url(#purpleGrad)" stroke-width="3" stroke-dasharray="8,5" opacity="0.6"/>
<path d="M-55,15 Q-27,10 -5,5" fill="none" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>
<path d="M-50,20 Q-25,15 -10,10" fill="none" stroke="url(#purpleGrad)" stroke-width="1" stroke-dasharray="4,3" opacity="0.2"/>

<!-- Paper plane -->
<g transform="rotate(-25)">
<path d="M0,0 L35,-8 L35,8 L8,2 Z" fill="url(#purpleGrad)"/>
<path d="M0,0 L8,2 L35,-8 Z" fill="#8e24aa" opacity="0.7"/>
<path d="M0,0 L8,2 L35,8 Z" fill="#6a1b9a" opacity="0.5"/>
</g>
</g>

<!-- CONSULTANCY text with modern spacing -->
<text x="325" y="180" text-anchor="middle" fill="#6a1b9a" font-family="Arial, Helvetica, sans-serif" font-size="20px" font-weight="300" letter-spacing="12px" opacity="0.9">CONSULTANCY</text>

<!-- Decorative underline -->
<rect x="160" y="190" width="330" height="2" fill="url(#purpleGrad)" opacity="0.3"/>

<!-- Optional: Small decorative dots -->
<circle cx="150" cy="191" r="3" fill="#00897b" opacity="0.5"/>
<circle cx="500" cy="191" r="3" fill="#00897b" opacity="0.5"/>
</svg>